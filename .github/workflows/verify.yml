name: Verify engine

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.engine-and-web.outputs.version }}
      commit:
        value: ${{ jobs.engine-and-web.outputs.commit }}

permissions:
  contents: read

jobs:
  engine-and-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.engine.outputs.version }}
      commit: ${{ steps.engine.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check release packaging safeguards
        run: python3 -m unittest discover -s tools -p 'test_release.py'
      - name: Check engine version and release tag
        id: engine
        env:
          RELEASE_BUILD: ${{ inputs.release }}
        run: python3 tools/package_release.py version
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            kotlin-js-store/package-lock.json
            verification/web/package-lock.json
      - name: Test both targets and build artifacts
        run: bash ./gradlew check jvmJar publishAllPublicationsToLocalBuildRepository --no-daemon
      - name: Pack the JavaScript library
        run: npm pack ./build/npm --pack-destination ./build
      - name: Install web verification dependencies
        working-directory: verification/web
        run: npm ci
      - name: Consume the packed library
        working-directory: verification/web
        env:
          ENGINE_VERSION: ${{ steps.engine.outputs.version }}
        run: npm install --no-save --package-lock=false "../../build/khmer-calendar-engine-${ENGINE_VERSION}.tgz"
      - name: Check TypeScript and build the browser bundle
        working-directory: verification/web
        run: npm run build
      - name: Run the browser consumer
        run: python3 tools/verify_browser.py --browser google-chrome
      - name: Verify Android Java and Kotlin consumers
        run: bash ./gradlew -p verification/android testDebugUnitTest assembleDebug --no-daemon
      - name: Prepare release packages and checksums
        run: python3 tools/package_release.py stage
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: build/release/${{ steps.engine.outputs.version }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: engine-artifacts
          path: |
            build/libs/*-jvm-*.jar
            build/khmer-calendar-engine-*.tgz
            build/repository
            build/reports/tests
            build/reports/browser-verification.json
            verification/android/build/reports/tests
          if-no-files-found: error
